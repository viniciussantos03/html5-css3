<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        #cxA {
            /* 
            Valor padrão:

            flex: 0 1 auto; 
            */

            flex: initial;
        }

        #cxB {
            /* flex: 0 0 auto; */
            
            flex: none;
        }

        #cxC {
            /* 
            valor flexivel:

            flex: 1 1 auto; 
            */

            flex: auto;
        }

        #cxD {
            /* 
            Valor do crescimento apenas:
            
            flex: 3; 
            */

            flex: 3 1 auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        <div class="item" id="cxD">D</div>
    </div>
</body>
</html>
