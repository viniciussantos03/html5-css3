<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        #cxA {
            /* 
            Ordem Shorthand:
            
            flex-grow: 1;
            flex-shrink: 4;
            flex-basis: 200px; 
            */

            flex: 1 4 150px;
        }

        #cxB {
            /* 
            Ordem Shorthand:
            
            flex-grow: 2;
            flex-shrink: 1;
            flex-basis: 200px; 
            */

            flex: 2 1 200px;
        }

        #cxC {
            /* 
            Ordem Shorthand:
            
            flex-grow: 4;
            flex-shrink: 2;
            flex-basis: 200px; 
            */

            flex: 4 2 300px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
