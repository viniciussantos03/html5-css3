<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        /*CSS prevalece*/
        iframe {
            height: 400px;
            width: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 

        <!--Tamanho padrão 300x150-->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500" scrooling="auto">
            <a href="https://www.cursoemvideo.com/" target="_blank" rel="external">Curso em Vídeo</a>
        </iframe>

        para aprender a programar.
    </p>

    <p>
        O repositótio do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
          no <a href="https://gustavoguanabara.github.io" target="_blank" rel="external">GitHub</a>
        </iframe>

        também é bem legal!
    </p>
</body>
</html>
